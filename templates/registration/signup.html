{% extends "base.html" %}
{% block title %}Sign Up - Task Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">
    <h3 class="text-center mb-4">📝 Create an Account</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-dark w-100 mt-3">Sign Up</button>
    </form>
    <div class="text-center mt-3">
      <small class="text-muted">
        Already have an account?
        <a href="{% url 'login' %}" class="text-decoration-none">Login here</a>
      </small>
    </div>
  </div>
</div>
{% endblock %}

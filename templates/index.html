<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Ilyas Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #0066cc;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: 20px auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, button, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #004999;
    }
    .tasks {
      max-width: 600px;
      margin: 20px auto;
    }
    .task {
      background: white;
      padding: 10px;
      margin-bottom: 10px;
      border-left: 5px solid #0066cc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>🧠 AI Ilyas Task Manager</h1>

  <form id="task-form">
    <input type="text" id="title" placeholder="Task title" required />
    <textarea id="description" placeholder="Task description (optional)"></textarea>
    <button type="submit">Add Task</button>
  </form>

  <div class="tasks" id="task-list"></div>

  <script>
    const API_BASE = "http://127.0.0.1:8000/api";

    async function fetchTasks() {
      const res = await fetch(`${API_BASE}/tasks/`);
      const tasks = await res.json();
      const list = document.getElementById('task-list');
      list.innerHTML = "";
      tasks.forEach(t => {
        const div = document.createElement('div');
        div.className = "task";
        div.innerHTML = `<strong>${t.title}</strong><br>${t.description || ""}`;
        list.appendChild(div);
      });
    }

    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;

      await fetch(`${API_BASE}/tasks/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ title, description })
      });

      document.getElementById('title').value = "";
      document.getElementById('description').value = "";
      fetchTasks();
    });

    // Load tasks on page load
    fetchTasks();
  </script>

</body>
</html>
